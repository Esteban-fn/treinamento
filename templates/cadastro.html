<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="../styles/home.css">
</head>
<body>

    <div class="login-box">
         <h2>Cadastre-se</h2> 
          <form id="cadastro-form">
                <input id="reg-email" type="email" placeholder="E-mail" required>
                <input id="reg-password" type="password" placeholder="Senha (mínimo 6 caracteres)" required>
                <input type="submit" value="Cadastrar">
          </form>
    
          <a id="login-link" href="home.html">Já possui conta? Faça login</a>
    </div>

    <script type="module" src="../scripts/cadastro.js"></script> <!-- type="module": indica que o script é um módulo JavaScript, permitindo o uso de importações e exportações entre arquivos JS -->
    
</body>
</html>
